<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absen</title>
</head>
<body>
    <h1>Form kehadiran Praktikan</h1>
    <form action="post">
        <label for="nama">Nama: </label>
        <input type="text" name="nama" id="nama" placeholder="Masukkan nama"><br><br>

        <label for="npm">NPM: </label>        
        <input type="number" name="npm" id="npm" placeholder="Masukkan npm"><br><br>

        <label for="kelas">Kelas: </label>
        <input type="combobox" list="daftarkelas" name="kelas" id="kelas" placeholder="Pilih kelas" ><br><br>

        <label for="tanggal">Tanggal: </label>
        <input type="date" name="tanggal" id="tanggal" placeholder=""><br><br>

        <label for="waktu">Waktu: </label>
        <input type="time" name="waktu" id="waktu" placeholder=""><br><br>

        <input type="submit" value="Submit">
    </form>

    <datalist id="daftarkelas">
        <option value="A"></option>
        <option value="B"></option>
    </datalist>
</body>
</html>
